[project]
name = "usgs-triplifier"
version = "0.1.0"
description = "Tool for converting the USGS GNIS dataset to RDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.49",
    "geopandas>=1.0.0",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.12.5",
    "pyogrio>=0.10.0",
    "rdflib>=7.6.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.1",
]

[tool.setuptools.packages.find]
include = ["usgs_triplifier*"]
exclude = ["usgs_triplifier.data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
