[project]
name = "usgs-triplifier"
version = "0.1.0"
description = "Software for converting the USGS GNIS dataset to RDF"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.42.49",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.12.5",
    "pyogrio>=0.10.0",
    "rdflib>=7.6.0",
    "requests>=2.32.0",
    "shapely>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["usgs_triplifier*"]
exclude = ["usgs_triplifier.data*"]

[tool.setuptools.package-data]
usgs_triplifier = ["shapes/*.ttl", "ontologies/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../etl/code"]
