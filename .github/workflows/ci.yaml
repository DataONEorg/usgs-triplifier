name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: usgs-triplifier
        run: uv sync
      - name: Lint (ruff check)
        working-directory: usgs-triplifier
        run: uv run ruff check usgs_triplifier tests ../etl/code
      - name: Formatting (ruff format --check)
        working-directory: usgs-triplifier
        run: uv run ruff format --check usgs_triplifier tests ../etl/code

  test:
    name: Unit tests (80% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: usgs-triplifier
        run: uv sync
      - name: Run pytest with coverage
        working-directory: usgs-triplifier
        run: >
          uv run pytest
          --cov=usgs_triplifier
          --cov-report=term-missing
          --cov-fail-under=80
